[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridcast"
version = "0.1.0"
description = "Probabilistic net load forecasting pipeline"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "requests>=2.31",
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "torch>=2.0",
    "entsoe-py>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ipykernel>=6.0",
    "ruff>=0.16.2",
]

dashboard = ["streamlit>=1.30"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ingestion*", "features*", "models*"]

[tool.ruff]
target-version = "py312"
line-length = 120
# dashboard/test_app.py relies on Streamlit's "magic" display (bare
# expressions auto-render to the UI) - not the dead code ruff thinks it is.
extend-exclude = ["dashboard/test_app.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
